name: FormaAI Production CI Pipeline

"on":
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  # -------------------------------------------------------------
  # Job 1: Backend Static Code Quality & Strict Type Verification
  # -------------------------------------------------------------
  backend-quality:
    name: Backend Code Quality & Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install uv (Fast Python Package Manager)
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "backend/pyproject.toml"

      - name: Set up Python 3.14
        run: uv python install 3.14

      - name: Install Backend Dependencies
        run: uv sync --dev

      - name: Ruff Code Quality & Formatting Check
        run: uv run ruff check src

      - name: Mypy Strict Static Type Verification
        run: uv run mypy

  # -------------------------------------------------------------
  # Job 2: Frontend Lint & Production Type-Check
  # -------------------------------------------------------------
  frontend-quality:
    name: Frontend Type Check & Build Validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package.json

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Vue-TSC Type Check & Vite Production Build
        run: npm run build

      - name: Verify Production Distribution Artifacts
        run: |
          test -f dist/index.html || { echo "dist/index.html missing"; exit 1; }
          echo "Frontend build successfully verified. Bundle size:"
          du -sh dist/

      - name: Upload Frontend Production Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 7

  # -------------------------------------------------------------
  # Job 3: Full Test Suite with Real Service Containers
  # -------------------------------------------------------------
  backend-tests:
    name: Backend Unit & Integration Tests (MySQL 8 + Redis 7)
    needs: backend-quality
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: formaai_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
          --character-set-server=utf8mb4
          --collation-server=utf8mb4_unicode_ci
          --default-time-zone=+00:00

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=5

    defaults:
      run:
        working-directory: backend

    env:
      FORMAAI_APP_ENV: testing
      FORMAAI_MYSQL_HOST: 127.0.0.1
      FORMAAI_MYSQL_PORT: 3306
      FORMAAI_MYSQL_USER: root
      FORMAAI_MYSQL_PASSWORD: root
      FORMAAI_MYSQL_DATABASE: formaai_test
      FORMAAI_REDIS_URL: redis://127.0.0.1:6379/0
      FORMAAI_JWT_ACCESS_SECRET: formaai-ci-access-secret-32-bytes-minimum!
      FORMAAI_JWT_REFRESH_SECRET: formaai-ci-refresh-secret-32-bytes-minimum!
      FORMAAI_STORAGE_DIR: /tmp/formaai-ci-storage

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "backend/pyproject.toml"

      - name: Set up Python 3.14
        run: uv python install 3.14

      - name: Install Backend Dependencies
        run: uv sync --dev

      - name: Run Alembic Database Migrations to Head
        run: uv run alembic upgrade head

      - name: Run Full Test Suite (Unit & Integration Matrix)
        run: |
          mkdir -p /tmp/formaai-ci-storage
          uv run pytest -v --import-mode=importlib --junitxml=test-results.xml

      - name: Upload Test Results XML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results
          path: backend/test-results.xml
          retention-days: 14

  # -------------------------------------------------------------
  # Job 4: Production Readiness Pre-Flight Inspection Gate
  # -------------------------------------------------------------
  production-readiness-gate:
    name: Production Readiness Gatekeeper Inspection
    needs: [backend-tests, frontend-quality]
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: formaai
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
          --character-set-server=utf8mb4
          --collation-server=utf8mb4_unicode_ci
          --default-time-zone=+00:00

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=5

    env:
      FORMAAI_APP_ENV: production
      FORMAAI_HOST: "0.0.0.0"
      FORMAAI_PORT: 8000
      FORMAAI_RELOAD: "false"
      FORMAAI_LOG_LEVEL: info
      FORMAAI_MYSQL_HOST: 127.0.0.1
      FORMAAI_MYSQL_PORT: 3306
      FORMAAI_MYSQL_USER: root
      FORMAAI_MYSQL_PASSWORD: root
      FORMAAI_MYSQL_DATABASE: formaai
      FORMAAI_REDIS_URL: redis://127.0.0.1:6379/0
      FORMAAI_JWT_ACCESS_SECRET: formaai-ci-access-secret-32-bytes-minimum!
      FORMAAI_JWT_REFRESH_SECRET: formaai-ci-refresh-secret-32-bytes-minimum!
      FORMAAI_STORAGE_DIR: /tmp/formaai-ci-prod-storage

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Download Frontend Build Artifact
        uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "backend/pyproject.toml"

      - name: Set up Python 3.14
        run: uv python install 3.14

      - name: Install Dependencies
        working-directory: backend
        run: uv sync

      - name: Execute Alembic Database Migrations
        working-directory: backend
        run: uv run alembic upgrade head

      - name: Seed Production Ready Standard Categories
        working-directory: backend
        run: uv run python scripts/seed_popular_categories.py

      - name: Run Production Pre-Flight Inspection Script
        working-directory: backend
        run: |
          mkdir -p /tmp/formaai-ci-prod-storage
          uv run python scripts/verify_production_readiness.py
